[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sticky-hdp-slds"
version = "0.1.0"
description = "Sticky hierarchical Dirichlet process switching linear dynamical system (Fox et al., arXiv:1003.3829)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Markus Semmler" }]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "matplotlib>=3.5",
]
keywords = ["bayesian-nonparametrics", "slds", "hidden-markov-model", "time-series"]

[dependency-groups]
examples = [
    "arch>=5.3",
]
dev = [
    "pytest>=7",
    "ruff>=0.6",
    "pre-commit>=3",
    { include-group = "examples" },
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["model*", "slds*", "misc*", "data*", "debug*", "test_runner*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["model", "slds", "misc", "data", "debug", "test_runner", "examples", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Examples insert the repo root on sys.path before importing the package
# so `python examples/...` works without an editable install.
"examples/*" = ["E402"]
