[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sticky-hdp-slds"
version = "0.1.0"
description = "Sticky hierarchical Dirichlet process switching linear dynamical system (Fox et al., arXiv:1003.3829)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Markus Semmler" }]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "matplotlib>=3.5",
]
keywords = ["bayesian-nonparametrics", "slds", "hidden-markov-model", "time-series"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["model*", "slds*", "misc*", "data*", "debug*", "test_runner*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
